# SandBench local stack.
#
#   docker compose up                  → redis + frontend
#   docker compose --profile backend up → also api + worker (from ./engine)
#

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Point the UI at the gateway once it's running.
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - redis

  # ── Backend services (profile: backend) — require ./backend to be built ──

  db:
    image: postgres:16-alpine
    profiles: ["backend"]
    environment:
      - POSTGRES_USER=sandbench
      - POSTGRES_PASSWORD=sandbench
      - POSTGRES_DB=sandbench
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbench"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./engine
    profiles: ["backend"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - UPSTASH_REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./engine
    profiles: ["backend"]
    command: python worker.py
    environment:
      - UPSTASH_REDIS_URL=redis://redis:6379
    # The worker spawns ephemeral sandbox containers via the host Docker daemon.
    # Mounting the socket grants broad host access — acceptable for local dev
    # only. Production should use a rootless/remote daemon, gVisor, or
    # Firecracker (see build guide §2).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db-data:
