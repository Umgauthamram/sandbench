deterministic_scoring: true
description: >
  A lightweight JSON document database engine. The query logic resides in db/query.py.
  Currently, the nested field lookup in db/query.py fails when searching deep properties
  (e.g., 'user.profile.age') and does not correctly handle missing intermediate keys.
  Fix the QueryEngine nested attribute retrieval and filter execution in db/query.py.
entrypoint: db/query.py
test_command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "/workspace/tests/", "--tb=no"]
scorer: pytest_fraction
broken_code: |
  class QueryEngine:
      def __init__(self, storage):
          self.storage = storage

      def _get_nested_val(self, obj: dict, path: str):
          # Bug: Only supports single-level lookup, fails on nested paths like 'profile.age'
          return obj.get(path)

      def execute(self, filters: dict) -> list:
          results = []
          for doc_id, doc in self.storage.all().items():
              match = True
              for path, target in filters.items():
                  val = self._get_nested_val(doc, path)
                  if val != target:
                      match = False
                      break
              if match:
                  results.append(doc)
          return results
