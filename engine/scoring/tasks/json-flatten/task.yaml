id: json-flatten
title: Flatten nested JSON
language: python
difficulty: medium
description: >
  Implement flatten(obj) that collapses a nested dict into dot-delimited keys.
  For example, {"a": {"b": 1}} becomes {"a.b": 1}. Lists should be flattened
  with their integer index as the key segment.
entrypoint: solution.py
test_command: ["python", "-m", "pytest", "-q", "/workspace/tests/", "--tb=no"]
scorer: pytest_fraction
