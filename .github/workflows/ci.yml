name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f engine/requirements.txt ]; then pip install -r engine/requirements.txt; fi
          pip install pytest pytest-asyncio requests pydantic pyyaml

      - name: Run unit tests (excluding docker integration)
        run: |
          cd engine
          python -m pytest -m "not integration" -v

  task-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f engine/requirements.txt ]; then pip install -r engine/requirements.txt; fi
          pip install pydantic pyyaml requests

      - name: Run task validation in strict mode
        run: |
          cd engine
          python -m scoring.registry --strict

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript typecheck
        run: |
          cd frontend
          npx tsc --noEmit
